services:
  docmost:
    # Image built by .github/workflows/build-image.yml and published to GHCR.
    # Deploy: `docker compose pull && docker compose up -d` (no local build, so no
    # package-registry access is needed from this machine).
    #
    # Local fallback: `docker compose up -d --build` (requires container egress to
    # registry.npmjs.org, or build with host networking, see README).
    image: ghcr.io/immaioz/docmost_patched:latest
    # `:latest` is mutable: without this, `docker compose up` would reuse an
    # already-present local image and never see newer builds.
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
    environment:
      APP_URL: '${APP_URL:-http://localhost:3000}'
      APP_SECRET: '${APP_SECRET}'
      DATABASE_URL: 'postgresql://docmost:${DB_PASSWORD}@db:5432/docmost'
      REDIS_URL: 'redis://redis:6379'
      MAIL_DRIVER: '${MAIL_DRIVER:-smtp}'
      SMTP_HOST: '${SMTP_HOST}'
      SMTP_PORT: '${SMTP_PORT}'
      SMTP_USERNAME: '${SMTP_USERNAME}'
      SMTP_PASSWORD: '${SMTP_PASSWORD}'
      SMTP_SECURE: '${SMTP_SECURE:-false}'
      MAIL_FROM_ADDRESS: '${MAIL_FROM_ADDRESS}'
      MAIL_FROM_NAME: '${MAIL_FROM_NAME:-Docmost}'
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
