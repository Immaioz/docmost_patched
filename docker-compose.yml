services:
  docmost:
    # Published by .github/workflows/build-image.yml on every push to main.
    # Deployment: `docker compose pull && docker compose up -d` (no local build,
    # so no registry access is needed from this machine).
    #
    # Local build instead: `docker compose up -d --build`, or, if container DNS is
    # filtered (WSL/campus networks), build with host networking and tag it as the
    # same name: `docker buildx build --allow=network.host --network=host \
    #   -t ghcr.io/immaioz/docmost_patched:latest .`
    image: ghcr.io/immaioz/docmost_patched:latest
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
    environment:
      APP_URL: 'http://localhost:3000'
      APP_SECRET: 'REPLACE_WITH_LONG_SECRET'
      DATABASE_URL: 'postgresql://docmost:STRONG_DB_PASSWORD@db:5432/docmost'
      REDIS_URL: 'redis://redis:6379'
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: STRONG_DB_PASSWORD
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
